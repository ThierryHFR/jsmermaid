server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /local-editor/ {
        try_files $uri $uri/ /local-editor/index.html;
    }
}
